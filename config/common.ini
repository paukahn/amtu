reports_folder=reportes
stock_folder=stock
trackings_folder=trackings
orders_folder=orders
mode=debug

# Sanity-guard del stock (opcional; defaults: 0.5 y 10).
# Si la fracción de filas con SKU válido cae por debajo de stock_min_valid_ratio
# (y hay al menos stock_guard_min_rows filas), el feed NO se publica y se avisa.
# stock_min_valid_ratio=0.5
# stock_guard_min_rows=10

# Entorno SP-API (pase 3; default: production). Con 'sandbox' todas las
# llamadas van a sandbox.sellingpartnerapi-*.amazon.com — para probar sin
# tocar el catálogo vivo.
# environment=production

# Retención (pase 3). ¡OJO! Las líneas comentadas muestran los DEFAULTS, que
# están ACTIVOS aunque no se descomenten (igual que el sanity-guard de arriba).
# Descomenta y cambia el valor para ajustar; <=0 desactiva esa regla.
# orders_backup contiene PII de compradores: Amazon DPP exige <=30 días.
# retention_backup_days=30
# retention_temp_days=7
# retention_logs_days=90