# Reintentos de polling (esperar a que Amazon prepare informes/feeds).
# Durante la espera el programa escribe «… sigo esperando …» cada ~15s,
# así que aunque max_delay sea alto NO parece colgado.

[feeds]
base_delay  = 5
factor      = 1.5
max_delay   = 60
jitter      = 0.2
max_attempts = 50

[reports]
base_delay  = 10
factor      = 1.8
max_delay   = 120
jitter      = 0.25
max_attempts = 40

[vat_reports]
base_delay  = 15
factor      = 2.0
max_delay   = 180
jitter      = 0.3
max_attempts = 45

[trackings]
base_delay  = 5
factor      = 1.5
max_delay   = 60
jitter      = 0.2
max_attempts = 15
